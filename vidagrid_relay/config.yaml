name: "VidaGrid Relay (Chromium)"
version: "3.0.0"
slug: "vidagrid_relay"
description: >-
  A full Chromium browser, reachable from Home Assistant's own sidebar (via
  Ingress) or directly by IP, that stays logged into the VidaGrid/Growatt
  portal behind Base Power batteries and relays fresh telemetry to the
  VidaGrid Growatt integration's webhook every few minutes -- so its
  sensors keep working without a manual token paste every ~20 minutes. Set
  your webhook URL and inverter serial numbers in this add-on's
  Configuration tab, then see the integration's README.md for the
  one-time login step. Built on jlesage/chromium.
url: "https://github.com/jabone/ha-vidagrid-growatt"
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
# SYS_ADMIN lets Chromium create the PID/user namespaces its own sandbox
# needs -- the single, minimal privilege this base image documents needing.
# No AppArmor or full_access changes required (unlike the linuxserver/chromium
# base this add-on used before v3.0.0).
# See https://github.com/jlesage/docker-chromium#enable-usage-of-sandbox
privileged:
  - SYS_ADMIN
ingress: true
ingress_port: 5800
ports:
  5800/tcp: 5800
  5900/tcp: 5900
ports_description:
  5800/tcp: "Web-based Chromium screen -- open via the sidebar (Ingress) or directly for the one-time login."
  5900/tcp: "VNC access (optional)"
environment:
  LANG: "en_US.UTF-8"
  TZ: "Etc/UTC"
  KEEP_APP_RUNNING: "1"
  CHROMIUM_APP_URL: "https://growatt-us.vidagrid.com/main/overview"
  CHROMIUM_CUSTOM_ARGS: "--load-extension=/tmp/vidagrid-extension"
options:
  webhook_url: ""
  inverter_sns: []
schema:
  webhook_url: "url"
  inverter_sns:
    - "str"
